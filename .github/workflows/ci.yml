name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4 pyyaml==6.0.2 pytest==8.3.3
      - name: Run tests (no tokenizer / GPU needed)
        run: pytest tests/test_bidirectional.py tests/test_diffusion.py tests/test_resume.py -q
